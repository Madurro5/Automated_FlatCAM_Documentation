site_name: Documentation CNC
site_description: Documentation complète de la chaîne CNC — logiciels, machine, développement FlatCAM.
site_author: Projet CNC
docs_dir: docs
site_dir: site

# ─────────────────────────────────────────
#  THÈME
# ─────────────────────────────────────────
theme:
  name: material
  language: fr

  font:
    text: Inter
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair

  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - tables.border
    - tables.sort

extra_css:
  - assets/stylesheets/custom.css
  - assets/stylesheets/pdf-print.css   # ← Styles dédiés au rendu PDF (ignorés en web)

# ─────────────────────────────────────────
#  PLUGINS
# ─────────────────────────────────────────
plugins:
  - search:
      lang: fr

  - glightbox:
      touchNavigation: true
      effect: zoom

  - minify:
      minify_html: true

  - mkdocs-video
  
  - with-pdf:
      # ── Métadonnées de couverture ──────────────────────────────────────
      author: Projet CNC
      copyright: "© 2025 Projet CNC — Tous droits réservés"
      cover: true
      back_cover: false
      cover_title: Documentation CNC
      cover_subtitle: Documentation complète logicielle et matérielle de la chaîne CNC

      # ── Table des matières ────────────────────────────────────────────
      toc_title: "Table des matières"
      toc_level: 3           # Profondeur max : H1 → H3
      heading_shift: true    # Réindente les titres selon la hiérarchie nav

      # ── Numérotation des chapitres ────────────────────────────────────
      ordered_chapter_level: 2  # Numérotation automatique jusqu'au niveau H2

      # ── Pages exclues du PDF ──────────────────────────────────────────
      # Décommentez et adaptez si certaines pages ne doivent pas figurer dans le PDF
      # exclude_pages:
      #   - 'index.md'               # Page d'accueil (souvent redondante avec la couverture)

      # ── Exclusion de sous-sections ────────────────────────────────────
      # excludes_children:
      #   - 'chaine-logicielle/flatcam-fork/:generateur-setup'

      # ── Rendu des iframes (diagrammes Mermaid, vidéos, etc.) ─────────
      # Convertit les iframes embarquées en image statique pour le PDF.
      # Syntaxe : src + img (poster) + text (alt)
      # convert_iframe:
      #   - src: https://www.youtube.com/embed/XXXXX
      #     img: https://img.youtube.com/vi/XXXXX/0.jpg
      #     text: "Voir la vidéo en ligne"

      # ── Mise en page ──────────────────────────────────────────────────
      two_columns_level: 0   # 0 = une seule colonne (recommandé pour la technique)

      # ── Chemin de sortie ──────────────────────────────────────────────
      output_path: documentation-cnc.pdf

      # ── Activation conditionnelle (CI/CD) ────────────────────────────
      # Décommentez pour n'activer le PDF que si la variable d'env est définie :
      enabled_if_env: ENABLE_PDF_EXPORT

      # ── Rendu JavaScript (Mermaid, etc.) ─────────────────────────────
      # Nécessite Chromium installé sur la machine de build
      render_js: false
      # headless_chrome_path: 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'   # Adapter selon l'OS : chromium / google-chrome

      # ── Débogage ──────────────────────────────────────────────────────
      # debug_html: true    # Génère un HTML intermédiaire pour inspecter le rendu
      # show_anchors: true
      # verbose: true

# ─────────────────────────────────────────
#  EXTENSIONS MARKDOWN
# ─────────────────────────────────────────
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html

extra:
  generator: false

# ─────────────────────────────────────────
#  NAVIGATION
# ─────────────────────────────────────────
nav:
  - Accueil: index.md

  - Chaîne logicielle:
    - chaine-logicielle/index.md
    - KiCad: chaine-logicielle/kicad.md
    - Automated FlatCAM:
      - chaine-logicielle/automated-flatcam/index.md
      - Guide Débutant: chaine-logicielle/automated-flatcam/guide-debutant.md
      - Guide Avancé: chaine-logicielle/automated-flatcam/guide-avance.md
    - OpenBuilds Control: chaine-logicielle/openbuilds-control.md
    - Développement FlatCAM Fork: 
      - chaine-logicielle/developpement-flatcam-fork/index.md
      - Installation du code: chaine-logicielle/developpement-flatcam-fork/installation-dev.md
      - Code annoté: chaine-logicielle/developpement-flatcam-fork/code-annote.md
      - Générateur de setup: chaine-logicielle/developpement-flatcam-fork/generateur-setup.md

  - Machine CNC:
    - cnc/index.md
    - Guide d'utilisation: cnc/guide-utilisation.md
    - Outils & Matériaux: cnc/outils-materiaux.md
    - Mises à jour & Upgrades:
      - cnc/upgrades/index.md
      - Moteurs pas à pas: cnc/upgrades/moteurs.md
      - Détecteur de surface Z: cnc/upgrades/detecteur-z.md
      - Broche: cnc/upgrades/broche.md
      - Arret d'urgence: cnc\upgrades\arret-urgence.md
      - GRBL HAL pour STM32: cnc/upgrades/grbl-hal-stm32.md

watch:
  - docs